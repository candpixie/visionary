<!DOCTYPE html>
<html>
<head>
    <title>GLAUCOGUARD - Live Feed</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #001919 30%, #004D4D 70%, #000000 100%);
            background-attachment: fixed;
            color: #00CED1;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .video-container {
            max-width: 100%;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #00CED1;
            padding-bottom: 10px;
            color: #00CED1;
            text-shadow: 0 0 10px rgba(0, 206, 209, 0.5);
        }
        
        #video {
            width: 100%;
            height: auto;
            max-height: 90vh;
            border: 2px solid #00CED1;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 206, 209, 0.3);
            display: block;
            object-fit: contain; /* Show entire frame without cropping */
            transform: translateZ(0); /* Hardware acceleration */
            will-change: src; /* Optimize for frequent src changes */
            backface-visibility: hidden; /* Improve rendering performance */
            -webkit-backface-visibility: hidden;
            image-rendering: -webkit-optimize-contrast; /* Faster rendering */
            image-rendering: crisp-edges; /* Faster rendering */
            image-rendering: pixelated; /* Fastest rendering mode */
        }

        #noVideoMessage {
            text-align: center;
            color: #00CED1;
            padding: 20px;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 206, 209, 0.5);
        }
    </style>
</head>
<body>
    <div class="video-container">
        <h2>GLAUCOGUARD - LIVE FEED (Phone Camera)</h2>
        <img id="video" style="min-height: 200px;" />
        <div id="noVideoMessage" style="display: none;">
            No video stream. Start streaming from your phone.
        </div>
    </div>

    <script>
        // WebSocket connection to backend
        let ws = null;
        let reconnectInterval = null;

        function connectWebSocket() {
            // Connect to WebSocket server
            // Default to localhost:8765, but allow override via URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const wsHost = urlParams.get('host') || 'localhost';
            const wsPort = urlParams.get('port') || '8765';
            const wsUrl = `ws://${wsHost}:${wsPort}`;
            
            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('Connected to GlaucoGuard server');
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Handle video frames from mobile camera
                    if (data.type === 'video_frame' && data.data) {
                        displayVideoFrame(data.data);
                    } else if (data.type === 'stop_streaming') {
                        clearVideoFrame();
                    } else if (data.type === 'phone_disconnected') {
                        clearVideoFrame();
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('Disconnected from server');
                clearVideoFrame();

                // Attempt to reconnect every 3 seconds
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(connectWebSocket, 3000);
                }
            };
        }

        let isStreaming = false;
        let latestFrame = null;
        
        function displayVideoFrame(base64Data) {
            if (!isStreaming) {
                isStreaming = true;
            }
            
            latestFrame = base64Data;
            updateFrameImmediately();
        }
        
        function updateFrameImmediately() {
            if (!isStreaming || !latestFrame) {
                return;
            }
            
            const base64Data = latestFrame;
            const video = document.getElementById('video');
            
            if (video && base64Data) {
                showVideoFrame();
                video.src = 'data:image/jpeg;base64,' + base64Data;
            }
        }
        
        function clearVideoFrame() {
            isStreaming = false;
            latestFrame = null;
            
            const video = document.getElementById('video');
            const noVideoMsg = document.getElementById('noVideoMessage');
            
            if (video) {
                video.src = '';
                video.style.display = 'none';
            }
            
            if (noVideoMsg) {
                noVideoMsg.style.display = 'block';
            }
        }
        
        function showVideoFrame() {
            const video = document.getElementById('video');
            const noVideoMsg = document.getElementById('noVideoMessage');
            if (video) {
                video.style.display = 'block';
            }
            if (noVideoMsg) {
                noVideoMsg.style.display = 'none';
            }
        }

        // Start the application
        window.onload = function() {
            connectWebSocket();
        };
    </script>
</body>
</html>
