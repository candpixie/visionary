<!DOCTYPE html>
<html>
<head>
    <title>GLAUCOGUARD - Detection System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            padding: 20px;
            margin: 0;
        }

        .video-container {
            flex: 2;
            margin-right: 20px;
        }

        video, #video {
            width: 100%;
            border: 2px solid #00ff00;
            background: #000;
        }
        
        #video {
            display: block;
            object-fit: contain;
            transform: translateZ(0); /* Hardware acceleration */
            will-change: contents; /* Optimize for frequent content changes */
            backface-visibility: hidden; /* Improve rendering performance */
            -webkit-backface-visibility: hidden;
            image-rendering: auto; /* Let browser optimize rendering */
            image-rendering: -webkit-optimize-contrast; /* Better quality */
        }

        .info-panel {
            flex: 1;
            border: 2px solid #00ff00;
            padding: 20px;
            min-width: 300px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }

        .zone {
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 20px;
            text-align: center;
            background: #0a0a0a;
            transition: all 0.3s;
        }

        .zone.active {
            background: #ff0000;
            border-color: #ff0000;
            animation: pulse 0.5s infinite;
            color: #fff;
            font-weight: bold;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status {
            margin: 20px 0;
            font-size: 18px;
        }

        .status strong {
            display: inline-block;
            width: 150px;
        }

        .distance-bar {
            height: 30px;
            background: #333;
            margin: 10px 0;
            border-radius: 5px;
            overflow: hidden;
        }

        .distance-fill {
            height: 100%;
            background: linear-gradient(to right, #00ff00, #ffff00, #ff0000);
            transition: width 0.3s;
        }

        #connectionStatus {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #ff0000;
            border: 2px solid #fff;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            max-width: 250px;
            text-align: center;
        }

        #connectionStatus.connected {
            background: #00ff00;
            color: #000;
        }

        .zone-distance {
            font-size: 16px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="connectionStatus">DISCONNECTED</div>

    <div class="video-container">
        <h2>GLAUCOGUARD - LIVE FEED (Phone Camera)</h2>
        <img id="video" style="width: 100%; border: 2px solid #00ff00; background: #000; min-height: 200px;" />
        <div id="noVideoMessage" style="display: none; text-align: center; color: #00ff00; padding: 20px; font-family: 'Courier New', monospace;">
            No video stream. Start streaming from your phone.
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="info-panel">
        <h2>DETECTION STATUS</h2>

        <div id="leftZone" class="zone">
            ← LEFT ZONE<br>
            <span id="leftDist" class="zone-distance">--</span>
        </div>

        <div id="centerZone" class="zone">
            ↑ CENTER ZONE<br>
            <span id="centerDist" class="zone-distance">--</span>
        </div>

        <div id="rightZone" class="zone">
            RIGHT ZONE →<br>
            <span id="rightDist" class="zone-distance">--</span>
        </div>

        <div class="status">
            <strong>SYSTEM STATUS:</strong> <span id="status">INITIALIZING</span>
        </div>

        <div class="status">
            <strong>DETECTIONS:</strong> <span id="detectionCount">0</span>
        </div>

        <div class="status">
            <strong>HAPTIC STATUS:</strong> <span id="hapticStatus">READY</span>
        </div>
    </div>

    <script>
        // WebSocket connection to backend
        let ws = null;
        let detectionCount = 0;
        let reconnectInterval = null;
        let phoneConnected = false; // Track if phone is connected

        function connectWebSocket() {
            // Connect to WebSocket server (adjust port as needed)
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = function() {
                console.log('Connected to GlaucoGuard server');
                updateConnectionStatus();
                document.getElementById('status').textContent = 'READY';
                // Keep detection paused until streaming starts
                pauseDetectionUpdates = true;
                isStreaming = false;
                phoneConnected = false; // Phone not connected yet

                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Handle video frames from mobile camera
                    if (data.type === 'video_frame' && data.data) {
                        // Phone is connected and streaming
                        phoneConnected = true;
                        updateConnectionStatus();
                        // Resume detection updates when streaming starts
                        pauseDetectionUpdates = false;
                        // Set streaming flag and process frame
                        isStreaming = true;
                        displayVideoFrame(data.data);
                    } else if (data.type === 'stop_streaming') {
                        console.log('*** STOP STREAMING RECEIVED - PAUSING VIDEO AND DETECTION ***');
                        // Immediately stop processing and clear video
                        isStreaming = false;
                        pauseDetectionUpdates = true; // Pause detection updates
                        latestFrame = null; // Clear latest frame
                        isProcessingFrame = false;
                        clearVideoFrame();
                        console.log('Video cleared, isStreaming:', isStreaming);
                        console.log('Detection updates paused:', pauseDetectionUpdates);
                    } else if (data.type === 'phone_disconnected') {
                        console.log('*** PHONE DISCONNECTED - CLEARING VIDEO AND PAUSING ***');
                        // Phone disconnected - clear everything
                        phoneConnected = false;
                        updateConnectionStatus();
                        isStreaming = false;
                        pauseDetectionUpdates = true; // Pause detection updates
                        latestFrame = null; // Clear latest frame
                        isProcessingFrame = false;
                        clearVideoFrame();
                        
                        // Update status to show phone disconnected
                        const statusEl = document.getElementById('status');
                        if (statusEl) {
                            statusEl.textContent = 'PHONE DISCONNECTED';
                        }
                        console.log('Phone disconnected - video cleared');
                    } else if (data.type === 'connection') {
                        // Connection message - ignore
                        console.log('Connection message:', data.message);
                    } else {
                        // Handle detection data (messages without 'type' field or with detection/zones)
                        // CRITICAL: Only process if streaming is active and not paused
                        if (data.detection !== undefined || data.zones !== undefined) {
                            // This is detection data - check if we should process it
                            if (pauseDetectionUpdates || !isStreaming) {
                                // Ignore detection data when paused or not streaming
                                console.log('*** DETECTION DATA IGNORED - pauseDetectionUpdates:', pauseDetectionUpdates, 'isStreaming:', isStreaming);
                                return; // Don't process detection data - exit early
                            }
                            // Process detection data only if streaming and not paused
                            handleDetectionData(data);
                        }
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('Disconnected from server');
                phoneConnected = false;
                updateConnectionStatus();
                document.getElementById('status').textContent = 'OFFLINE';
                clearVideoFrame(); // Clear video when disconnected
                isStreaming = false; // Ensure streaming flag is reset
                pauseDetectionUpdates = true; // Pause detection updates when disconnected

                // Attempt to reconnect every 3 seconds
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(connectWebSocket, 3000);
                }
            };
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (!statusEl) return;
            
            if (ws && ws.readyState === 1) {
                // Web browser is connected to server
                if (phoneConnected) {
                    statusEl.textContent = 'PHONE CONNECTED';
                    statusEl.classList.add('connected');
                } else {
                    statusEl.textContent = 'SERVER CONNECTED (NO PHONE)';
                    statusEl.classList.remove('connected');
                }
            } else {
                statusEl.textContent = 'DISCONNECTED';
                statusEl.classList.remove('connected');
            }
        }
        
        function handleDetectionData(data) {
            // Update detection count
            if (data.detection) {
                detectionCount++;
                document.getElementById('detectionCount').textContent = detectionCount;
            }

            // Update zones
            if (data.zones) {
                updateZone('left', data.zones.left);
                updateZone('center', data.zones.center);
                updateZone('right', data.zones.right);
            }

            // Update haptic status
            if (data.haptic) {
                document.getElementById('hapticStatus').textContent = data.haptic.toUpperCase();
            }
        }

        function updateZone(zone, distance) {
            const zoneEl = document.getElementById(zone + 'Zone');
            const distEl = document.getElementById(zone + 'Dist');

            if (distance !== null && distance < 200) {
                zoneEl.classList.add('active');
                distEl.textContent = distance + ' cm';
            } else {
                zoneEl.classList.remove('active');
                distEl.textContent = distance !== null ? distance + ' cm' : 'CLEAR';
            }
        }

        // Display video frame from mobile camera with optimization
        let isStreaming = false;
        let latestFrame = null; // Store only the latest frame for minimal latency
        let pauseDetectionUpdates = true; // Start with detection paused - only show when streaming
        let frameUpdateInterval = null; // Timer for continuous frame updates
        
        // Target FPS for display (60 FPS = ~16ms for smooth video)
        const targetFPS = 60;
        const frameInterval = 1000 / targetFPS; // ~16ms for 60 FPS
        
        function displayVideoFrame(base64Data) {
            // Double check streaming status before processing
            if (!isStreaming) {
                return; // Don't display if not streaming
            }
            
            // Store latest frame (always overwrite for minimal latency)
            latestFrame = base64Data;
            
            // Start continuous update loop if not already running
            if (!frameUpdateInterval && isStreaming) {
                startFrameUpdateLoop();
            }
        }
        
        function startFrameUpdateLoop() {
            // Clear any existing interval
            if (frameUpdateInterval) {
                clearInterval(frameUpdateInterval);
            }
            
            // Update frames at target FPS
            frameUpdateInterval = setInterval(() => {
                updateFrame();
            }, frameInterval);
        }
        
        function stopFrameUpdateLoop() {
            if (frameUpdateInterval) {
                clearInterval(frameUpdateInterval);
                frameUpdateInterval = null;
            }
        }
        
        function updateFrame() {
            // Stop processing if not streaming
            if (!isStreaming || !latestFrame) {
                stopFrameUpdateLoop();
                return;
            }
            
            const base64Data = latestFrame;
            const video = document.getElementById('video');
            
            if (video && base64Data) {
                showVideoFrame(); // Show video element
                // Update image source immediately
                video.src = 'data:image/jpeg;base64,' + base64Data;
            }
        }
        
        function clearVideoFrame() {
            console.log('*** CLEARING VIDEO FRAME - PAUSING VIDEO AND DETECTION ***');
            // Immediately stop all processing
            isStreaming = false;
            pauseDetectionUpdates = true; // Pause detection updates
            latestFrame = null; // Clear latest frame
            stopFrameUpdateLoop(); // Stop the frame update loop
            
            const video = document.getElementById('video');
            const noVideoMsg = document.getElementById('noVideoMessage');
            
            if (!video) {
                console.error('Video element not found!');
                return;
            }
            
            // Clear the image immediately - use multiple methods to ensure it clears
            video.src = '';
            video.removeAttribute('src');
            video.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
            video.style.display = 'none';
            
            if (noVideoMsg) {
                noVideoMsg.style.display = 'block';
                console.log('No video message displayed');
            } else {
                console.error('No video message element not found!');
            }
            
            // Update status to show paused
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = 'PAUSED';
            }
            
            // Clear all detection zones to show they're paused
            updateZone('left', null);
            updateZone('center', null);
            updateZone('right', null);
            document.getElementById('detectionCount').textContent = '0';
            document.getElementById('hapticStatus').textContent = 'PAUSED';
            
            console.log('Video cleared. Video display:', video.style.display);
            console.log('isStreaming flag:', isStreaming);
            console.log('Detection updates paused:', pauseDetectionUpdates);
        }
        
        function showVideoFrame() {
            const video = document.getElementById('video');
            const noVideoMsg = document.getElementById('noVideoMessage');
            video.style.display = 'block';
            if (noVideoMsg) {
                noVideoMsg.style.display = 'none';
            }
        }

        // Start the application
        window.onload = function() {
            // Don't initialize local camera - we'll use phone camera instead
            connectWebSocket();
        };
    </script>
</body>
</html>
